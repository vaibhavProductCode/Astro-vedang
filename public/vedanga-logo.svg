      .logo-accent { fill: #c17a1a; }
      .logo-text { fill: #2c2c2c; font-family: 'Georgia', serif; font-weight: 600; }
      @media (prefers-color-scheme: dark) {
        .logo-bg { fill: #1a1a1a; }
        .logo-main { fill: #c4d96f; }
        .logo-accent { fill: #e8b55d; }
        .logo-text { fill: #f5f1eb; }
      }
    </style>
  </defs>
  <rect width="400" height="400" class="logo-bg"/>
  <g transform="translate(200, 120)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="var(--accent, #c17a1a)" stroke-width="2" opacity="0.6"/>
    <path d="M 0,-55 L 39,-27 L 0,55 L -39,-27 Z" fill="none" stroke="var(--primary, #2d5016)" stroke-width="2.5"/>
    <line x1="-39" y1="-27" x2="39" y2="-27" stroke="var(--primary, #2d5016)" stroke-width="1.5" opacity="0.7"/>
    <line x1="-39" y1="-27" x2="0" y2="55" stroke="var(--primary, #2d5016)" stroke-width="1.5" opacity="0.7"/>
    <line x1="39" y1="-27" x2="0" y2="55" stroke="var(--primary, #2d5016)" stroke-width="1.5" opacity="0.7"/>
    <line x1="0" y1="-55" x2="0" y2="55" stroke="var(--accent, #c17a1a)" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="8" class="logo-accent"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="var(--accent, #c17a1a)" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="-35" r="3.5" class="logo-accent"/>
    <circle cx="25" cy="-10" r="3" class="logo-accent" opacity="0.8"/>
    <circle cx="-25" cy="-10" r="3" class="logo-accent" opacity="0.8"/>
    <circle cx="20" cy="20" r="2.5" class="logo-accent" opacity="0.6"/>
    <circle cx="-20" cy="20" r="2.5" class="logo-accent" opacity="0.6"/>
  </g>
  <text x="200" y="260" text-anchor="middle" font-size="48" class="logo-text" font-family="'Georgia', serif" letter-spacing="2">VEDANGA</text>
  <text x="200" y="295" text-anchor="middle" font-size="14" class="logo-text" opacity="0.7" letter-spacing="1" font-family="'Segoe UI', sans-serif">YOUR VEDIC BIRTH CHART</text>
  <line x1="80" y1="320" x2="320" y2="320" stroke="var(--accent, #c17a1a)" stroke-width="1.5" opacity="0.4"/>
